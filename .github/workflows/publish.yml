name: publish

# Trusted publishing (OIDC): no npm token, no OTP. The identity IS this
# workflow — precisa estar registrado no npmjs.com como trusted publisher de
# @valorbrain/cli e @valorbrain/connect (repo ValorBrain/valorbrain-cli,
# workflow publish.yml). Enquanto não estiver, um publish por aqui falha com
# E404 "Not found or you do not have permission".
#
# Roda no runner HOSPEDADO do GitHub (ubuntu-latest). O trusted publishing do
# npm não aceita runner self-hosted (docs.npmjs.com/trusted-publishers:
# "Self-hosted runners are not currently supported"): de 30/09 a 27/11 este
# job rodou no self-hosted do repo e falhava com E422 "Unsupported GitHub
# Actions runner environment: self-hosted", então toda versão saía por
# `npm publish` local. A conta valordigital tem 2FA só por chave de segurança,
# o que prende o publish local a quem tem a chave. O hospedado voltou a rodar
# (publish-mcp.yml roda em ubuntu-latest, verde em 26/11) e o repo é público,
# sem custo de minutos.
#
# Ordem de release: subir `version`, merge, rodar este workflow (ou taguear).
# Publish local continua possível e o job passa pelo check idempotente abaixo.
#
# Até 30/09 o erro saía verde: `if ! npm publish; then code=$?` guarda o status
# do `!` (0), então `exit $code` saía 0 — v0.5.0, v0.5.1 e v0.5.2 tiveram run
# "success" com o publish falhado, e cada versão foi publicada à mão depois.
#
# IDEMPOTENTE: se a versão do package.json já existe no registry, pula o
# publish — taguear um release não falha quando o pacote já foi publicado.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  id-token: write # OIDC — this is the whole auth model
  contents: read

jobs:
  publish:
    # GitHub-hosted: npm trusted publishing refuses self-hosted runners (E422).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm >= 12
        run: npm install -g npm@12 && npm --version

      - name: Publish @valorbrain/cli
        run: |
          PKG=@valorbrain/cli
          V=$(node -p "require('./package.json').version")
          for i in $(seq 1 6); do
            if npm view "$PKG@$V" version >/dev/null 2>&1; then
              echo "$PKG@$V já está no registry — pulando publish"; exit 0
            fi
            sleep 10
          done
          code=0
          npm publish --access public || code=$?
          if [ "$code" -ne 0 ]; then
            sleep 15
            if npm view "$PKG@$V" version >/dev/null 2>&1; then
              echo "publish retornou erro mas $PKG@$V está no registry (propagação) — seguindo"; exit 0
            fi
            echo "FALHA (exit $code): $PKG@$V não está no registry. E404 = este workflow não está registrado como trusted publisher do pacote no npmjs.com; E422 = o job saiu do runner hospedado (ver o cabeçalho)." >&2
            exit "$code"
          fi

      - name: Wait for @valorbrain/cli to resolve on the registry
        run: |
          for i in $(seq 1 12); do
            if npm view @valorbrain/cli version >/dev/null 2>&1; then
              echo "resolves"; exit 0
            fi
            sleep 5
          done
          echo "@valorbrain/cli not visible on registry yet" >&2
          exit 1

      - name: Publish @valorbrain/connect
        working-directory: packages/connect
        run: |
          PKG=@valorbrain/connect
          V=$(node -p "require('./package.json').version")
          for i in $(seq 1 6); do
            if npm view "$PKG@$V" version >/dev/null 2>&1; then
              echo "$PKG@$V já está no registry — pulando publish"; exit 0
            fi
            sleep 10
          done
          code=0
          npm publish --access public || code=$?
          if [ "$code" -ne 0 ]; then
            sleep 15
            if npm view "$PKG@$V" version >/dev/null 2>&1; then
              echo "publish retornou erro mas $PKG@$V está no registry (propagação) — seguindo"; exit 0
            fi
            echo "FALHA (exit $code): $PKG@$V não está no registry. E404 = este workflow não está registrado como trusted publisher do pacote no npmjs.com; E422 = o job saiu do runner hospedado (ver o cabeçalho)." >&2
            exit "$code"
          fi
