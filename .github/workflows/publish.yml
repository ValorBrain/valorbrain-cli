name: publish

# Trusted publishing (OIDC): no npm token, no OTP. The identity IS this
# workflow — precisa estar registrado no npmjs.com como trusted publisher de
# @valorbrain/cli e @valorbrain/connect (repo ValorBrain/valorbrain-cli,
# workflow publish.yml). Enquanto não estiver, um publish por aqui falha com
# E404 "Not found or you do not have permission" — e o caminho é publicar
# localmente com token (`npm publish --access public`), como em 21/09.
#
# Roda no runner self-hosted do repo (o hospedado do GitHub estava parado por
# billing). ATENÇÃO: o trusted publishing do npm NÃO aceita runner
# self-hosted (docs.npmjs.com/trusted-publishers: "Self-hosted runners are not
# currently supported"). Aqui o publish falha com E422 "Unsupported GitHub
# Actions runner environment: self-hosted" (visto no v0.5.2, 30/09). Até isso
# mudar, a ordem de release é: `npm publish --access public` local (conta
# valordigital) e DEPOIS a tag — o job passa pelo check idempotente abaixo.
# Tag sem publish local deixa o run VERMELHO, de propósito.
#
# Até 30/09 o erro saía verde: `if ! npm publish; then code=$?` guarda o status
# do `!` (0), então `exit $code` saía 0 — v0.5.0, v0.5.1 e v0.5.2 tiveram run
# "success" com o publish falhado, e cada versão foi publicada à mão depois.
#
# IDEMPOTENTE: se a versão do package.json já existe no registry, pula o
# publish — taguear um release não falha quando o pacote já foi publicado.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  id-token: write # OIDC — this is the whole auth model
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, valorbrain-cli]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm >= 12
        run: npm install -g npm@12 && npm --version

      - name: Publish @valorbrain/cli
        run: |
          PKG=@valorbrain/cli
          V=$(node -p "require('./package.json').version")
          for i in $(seq 1 6); do
            if npm view "$PKG@$V" version >/dev/null 2>&1; then
              echo "$PKG@$V já está no registry — pulando publish"; exit 0
            fi
            sleep 10
          done
          code=0
          npm publish --access public || code=$?
          if [ "$code" -ne 0 ]; then
            sleep 15
            if npm view "$PKG@$V" version >/dev/null 2>&1; then
              echo "publish retornou erro mas $PKG@$V está no registry (propagação) — seguindo"; exit 0
            fi
            echo "FALHA (exit $code): $PKG@$V não está no registry. Em runner self-hosted o trusted publishing não funciona (E422, ver o cabeçalho): publique local com 'npm publish --access public' e rode este workflow de novo." >&2
            exit "$code"
          fi

      - name: Wait for @valorbrain/cli to resolve on the registry
        run: |
          for i in $(seq 1 12); do
            if npm view @valorbrain/cli version >/dev/null 2>&1; then
              echo "resolves"; exit 0
            fi
            sleep 5
          done
          echo "@valorbrain/cli not visible on registry yet" >&2
          exit 1

      - name: Publish @valorbrain/connect
        working-directory: packages/connect
        run: |
          PKG=@valorbrain/connect
          V=$(node -p "require('./package.json').version")
          for i in $(seq 1 6); do
            if npm view "$PKG@$V" version >/dev/null 2>&1; then
              echo "$PKG@$V já está no registry — pulando publish"; exit 0
            fi
            sleep 10
          done
          code=0
          npm publish --access public || code=$?
          if [ "$code" -ne 0 ]; then
            sleep 15
            if npm view "$PKG@$V" version >/dev/null 2>&1; then
              echo "publish retornou erro mas $PKG@$V está no registry (propagação) — seguindo"; exit 0
            fi
            echo "FALHA (exit $code): $PKG@$V não está no registry. Em runner self-hosted o trusted publishing não funciona (E422, ver o cabeçalho): publique local com 'npm publish --access public' e rode este workflow de novo." >&2
            exit "$code"
          fi
