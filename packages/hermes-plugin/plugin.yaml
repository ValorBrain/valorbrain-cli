name: valorbrain
version: "1.6.0"
description: "ValorBrain — hosted hybrid memory (composite scoring, graph traversal, lifecycle) as a MemoryProvider plus MCP tools. Hosted: set VALORBRAIN_ENGINE_URL + VALORBRAIN_API_TOKEN (npx @valorbrain/connect writes them). Self-hosted: the valorbrain binary."
requires_hermes: ">=0.20"
external_dependencies:
  - name: valorbrain
    install: "Hosted: none — https://github.com/ValorBrain/valorbrain-cli. Self-hosted: valorbrain binary (Valor Digital)."
    check: "valorbrain --version"
hooks:
  - on_session_end
  - on_pre_compress
provides_middleware:
  - tool_execution
